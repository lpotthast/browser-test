[package]
name = "browser-test-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Attribute macros for browser-test."

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
manyhow = "0.14"
proc-macro-crate = "3.4"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full", "visit-mut"] }

[dev-dependencies]
# The documentation's examples use the attribute through `browser-test`. Without a version, the
# dependency is left out when publishing.
browser-test = { path = "../browser-test" }
rootcause.workspace = true

[lints]
workspace = true
