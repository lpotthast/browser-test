[package]
name = "browser-test-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Attribute macros for browser-test."
categories = ["development-tools::testing", "web-programming"]
keywords = ["browser", "webdriver", "chrome", "testing", "automation"]

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
manyhow = "0.14"
proc-macro-crate = "3.4"
proc-macro2 = "1.0.91"
quote = "1.0.35"
syn = { version = "3", features = ["full", "visit-mut"] }

[dev-dependencies]
assertr.workspace = true
# The documentation's examples use the attribute through `browser-test`. Without a version, the
# dependency is left out when publishing.
browser-test = { path = "../browser-test" }
rootcause.workspace = true
# The unit tests render syn types in assertion messages, which needs their Debug impls.
syn = { version = "3", features = ["extra-traits"] }
trybuild = "1.0.114"

[lints]
workspace = true
